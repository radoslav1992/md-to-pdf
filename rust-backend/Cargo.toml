[package]
name = "rust-backend"
version = "0.1.0"
edition = "2021"
authors = ["Universal Converter Team"]
description = "Universal Document Converter — self-hosted axum backend"
license = "MIT"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
time = "0.3"

# Database
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Conversion
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
quick-xml = { version = "0.36", features = ["serialize"] }
ammonia = { version = "4.0", default-features = false }
base64 = "0.22"
csv = "1.3"
orgize = "0.9"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-onig"] }
latex2mathml = "0.2"
once_cell = "1"
regex = "1"

# Batch / webhooks
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }

# Errors
thiserror = "1.0"
anyhow = "1.0"

# Crypto
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
subtle = "2.6"
rand = "0.8"
aes-gcm = "0.10"

# Process management
tempfile = "3"
