# Worker-local Wrangler config. `wrangler dev` from this directory spins up the
# Rust worker on its own port (default 8787), which the Astro dev server proxies
# to via the `/api/*` route during local development.

name = "universal-document-converter-api"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "cargo install -q worker-build && worker-build --release"

[vars]
ENVIRONMENT = "development"
PDF_RENDER_URL = "https://chrome.browserless.io/pdf"

# Secrets:
#   PDF_RENDER_TOKEN  -  Bearer token for the external PDF rendering service.

[dev]
port = 8787
ip = "127.0.0.1"
local_protocol = "http"
