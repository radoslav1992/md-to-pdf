[package]
name = "udc-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line client for the Universal Document Converter API"
license = "MIT"

[[bin]]
name = "udc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
directories = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
